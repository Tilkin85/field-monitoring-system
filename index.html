                                                        input.accept = 'image/*';
                                                        input.onchange = (e) => {
                                                            if (e.target.files[0]) {
                                                                handlePhotoUpload(index, e.target.files[0]);
                                                            }
                                                        };
                                                        input.click();
                                                    }}
                                                    style={{marginRight: '10px'}}
                                                >
                                                    🔄 Replace
                                                </button>
                                                <button
                                                    className="btn btn-clear btn-small"
                                                    onClick={() => {
                                                        const newPhotoLog = [...formData.photoLog];
                                                        newPhotoLog[index].photoFile = null;
                                                        newPhotoLog[index].photoPreview = null;
                                                        setFormData(prev => ({ ...prev, photoLog: newPhotoLog }));
                                                    }}
                                                >
                                                    🗑️ Remove Photo
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* Photo Details */}
                                <div className="form-grid grid-3 mb-15">
                                    <div className="form-group">
                                        <label className="form-label" htmlFor={`entry-26-${index}`}>Photo Number</label>
                                        <input id={`entry-26-${index}`}
                                            type="text"
                                            className="form-input"
                                            value={photo.photoNum}
                                            onChange={(e) => handlePhotoLogChange(index, 'photoNum', e.target.value)}
                                            placeholder="e.g., IMG_001"
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label" htmlFor={`entry-27-${index}`}>Date</label>
                                        <input id={`entry-27-${index}`}
                                            type="date"
                                            className="form-input"
                                            value={photo.date}
                                            onChange={(e) => handlePhotoLogChange(index, 'date', e.target.value)}
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label" htmlFor={`entry-28-${index}`}>Time</label>
                                        <input id={`entry-28-${index}`}
                                            type="time"
                                            className="form-input"
                                            value={photo.time}
                                            onChange={(e) => handlePhotoLogChange(index, 'time', e.target.value)}
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label" htmlFor={`entry-29-${index}`}>GPS Coordinates</label>
                                        <input id={`entry-29-${index}`}
                                            type="text"
                                            className="form-input"
                                            value={photo.gps}
                                            onChange={(e) => handlePhotoLogChange(index, 'gps', e.target.value)}
                                            placeholder="e.g., 34.0522°N, 118.2437°W"
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label" htmlFor={`entry-30-${index}`}>Cardinal Direction</label>
                                        <select id={`entry-30-${index}`}
                                            className="form-select"
                                            value={photo.direction}
                                            onChange={(e) => handlePhotoLogChange(index, 'direction', e.target.value)}
                                        >
                                            <option value="">Select direction...</option>
                                            <option value="N">North</option>
                                            <option value="NE">Northeast</option>
                                            <option value="E">East</option>
                                            <option value="SE">Southeast</option>
                                            <option value="S">South</option>
                                            <option value="SW">Southwest</option>
                                            <option value="W">West</option>
                                            <option value="NW">Northwest</option>
                                        </select>
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label" htmlFor={`entry-31-${index}`}>Equipment Used</label>
                                        <input id={`entry-31-${index}`}
                                            type="text"
                                            className="form-input"
                                            value={photo.equipment}
                                            onChange={(e) => handlePhotoLogChange(index, 'equipment', e.target.value)}
                                            placeholder="Camera model, lens, etc."
                                        />
                                    </div>
                                </div>
                                <div className="form-group">
                                    <label className="form-label" htmlFor={`entry-32-${index}`}>Description of Subject</label>
                                    <textarea id={`entry-32-${index}`}
                                        className="form-textarea"
                                        value={photo.description}
                                        onChange={(e) => handlePhotoLogChange(index, 'description', e.target.value)}
                                        placeholder="Describe what the photo shows, notable features, context, etc."
                                        rows="3"
                                    />
                                </div>
                            </div>
                        ))}
                    </div>

                    <section className="form-section" id="notes">
                        <h2 className="section-title">Extra notes & export</h2>
                        <label className="form-label" htmlFor="extraNotes">Extra notes for the attached notes pages</label>
                        <p className="section-help" id="notes-help">Add anything that does not belong in the printed fields. These notes appear after the original sheet.</p>
                        <textarea id="extraNotes" aria-describedby="notes-help" className="form-textarea extra-notes" rows="6" value={formData.extraNotes} onChange={e => handleInputChange('extraNotes',e.target.value)} placeholder="Additional context, follow-up actions, map references…" />
                        <label className="map-export-choice"><input type="checkbox" checked={formData.includeMap} onChange={e => handleInputChange('includeMap',e.target.checked)} /> Include the current map on the notes pages</label>
                        <p className="section-help">Recorded markers are always included. If the basemap is unavailable, the PDF includes a labeled coordinate plot.</p>
                        <button className="btn primary-export" disabled={exporting} onClick={exportToPDF}>{exporting ? 'Preparing PDF…' : 'Download completed PDF'}</button>
                        <p role="status">{status}</p>
                    </section>
                </div>
            );
        };

        ReactDOM.render(React.createElement(FieldMonitoringApp), document.getElementById('root'));
    </script>
</body>
</html>
